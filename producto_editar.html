<!doctype html>
<html lang="es">

<head>
  <title>Editar Producto</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <link rel="shortcut icon" href="img/favicon.png" type="image/x-icon">

  <!-- Bootstrap CSS v5.2.1 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.1/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-iYQeCzEYFbKjA/T2uDLTpkwGzCiq6soy8tYaI1GyVh/UjpbCx/TYkiZhlZB6+fzT" crossorigin="anonymous">

  <!-- Estilos globales -->
  <link rel="stylesheet" href="./css/style.css">

  <!-- Fuentes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Antonio:wght@400;600;700&family=Orbitron:wght@400;600;700&family=Press+Start+2P&family=Russo+One&family=Staatliches&family=Vidaloka&display=swap" rel="stylesheet">
</head>

<body>
  <div id="app">
    <navegacion></navegacion>

    <main>
      <div class="cuerpito">
        <form class="form" @submit.prevent="modificar">
          <h1 class="formt">Edición de producto</h1>

          <div v-if="cargando" class="text-center my-4">
            <div class="spinner-border text-info" role="status"></div>
            <p class="mt-2 text-muted">Cargando información del producto...</p>
          </div>

          <div v-else class="formc">
            <input type="hidden" v-model="id">

            <div class="mb-3 formi">
              <label class="fl" for="nombre">Nombre</label>
              <input class="fi" type="text" id="nombre" v-model="producto.nombre" required>
            </div>

            <div class="mb-3 formi">
              <label class="fl" for="precio">Precio</label>
              <input class="fi" type="number" step="0.01" id="precio" v-model.number="producto.precio" required>
            </div>

            <div class="mb-3 formi">
              <label class="fl" for="stock">Stock</label>
              <input class="fi" type="number" id="stock" v-model.number="producto.stock" required>
            </div>

            <div class="mb-3 formi">
              <label class="fl" for="imagen">URL Imagen</label>
              <input class="fi" type="text" id="imagen" v-model="producto.imagen">
            </div>

            <!-- Miniatura de previsualización reactiva -->
            <div class="mb-3 text-center" v-if="producto.imagen">
              <span class="d-block small text-muted mb-1">Miniatura actual:</span>
              <div class="preview-container">
                <img :src="producto.imagen" alt="Miniatura" class="preview-img">
              </div>
            </div>

            <button type="submit" class="btn btn-success" :disabled="enviando">
              <span v-if="enviando">Actualizando...</span>
              <span v-else>Actualizar Producto</span>
            </button>

            <a href="productos.html" class="btn btn-secondary w-100">Cancelar</a>
          </div>
        </form>
      </div>
    </main>

    <piesito></piesito>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"
    integrity="sha384-oBqDVmMz9ATKxIep9tiCxS/Z9fNfEXiDAYTujMAeBAsjFuCZSmKbSSUnQlmh/jp3" crossorigin="anonymous">
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.1/dist/js/bootstrap.min.js"
    integrity="sha384-7VPbUDkoPSGFnVtYi0QogXtr74QeVeeIs99Qfg5YCF+TidwNdjvaKZX19NZ/e6oz" crossorigin="anonymous">
  </script>

  <!-- Vue 3 CDN y Script -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="./js/producto_editar.js"></script>
</body>

</html>
